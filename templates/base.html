<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}MDZ C2{% endblock %}</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<style>
:root{
  --bg:#07070a; --panel:#0d0d12; --panel2:#12121a; --border:#1e1e2a;
  --red:#ff2d55; --red-dim:#ff2d5533; --text:#e8e8ef; --muted:#6b6b7b;
  --ok:#00e676; --warn:#ffd600;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;min-height:100vh;display:flex}
body::before{content:"";position:fixed;inset:0;background:
  radial-gradient(ellipse 80% 50% at 20% -10%,#ff2d5522,transparent),
  radial-gradient(ellipse 60% 40% at 100% 0%,#3d1a4a22,transparent);
  pointer-events:none;z-index:0}
.sidebar{width:240px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:20}
.sidebar-header{padding:28px 20px;border-bottom:1px solid var(--border);text-align:center}
.sidebar-header h2{margin:0;font-family:'JetBrains Mono',monospace;font-size:1.5rem;font-weight:800;letter-spacing:-1px}
.sidebar-header h2 span{color:var(--red)}
.nav-links{flex:1;padding:16px 12px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;color:var(--muted);text-decoration:none;border-radius:10px;margin-bottom:4px;font-weight:600;font-size:.88rem;transition:.2s;border:1px solid transparent}
.nav-item:hover,.nav-item.active{background:var(--red-dim);color:#fff;border-color:#ff2d5544}
.nav-item i{font-size:1.2rem}
.main{margin-left:240px;flex:1;padding:32px 40px;position:relative;z-index:1;min-height:100vh}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px;box-shadow:0 8px 32px #0006}
.card-title{font-family:'JetBrains Mono',monospace;font-size:1.15rem;font-weight:700;margin:0 0 20px;display:flex;align-items:center;gap:10px}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 12px var(--red)}
label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px;font-weight:600}
.cyber-input,select.cyber-input,textarea.cyber-input{
  width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:10px;
  padding:12px 14px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:.9rem;
  outline:none;transition:.2s
}
.cyber-input:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-dim)}
.cyber-btn{
  background:linear-gradient(135deg,var(--red),#c41840);color:#fff;border:none;border-radius:10px;
  padding:13px 22px;font-weight:700;font-size:.9rem;cursor:pointer;font-family:Inter,sans-serif;
  transition:.2s;letter-spacing:.02em
}
.cyber-btn:hover{filter:brightness(1.1);transform:translateY(-1px);box-shadow:0 6px 20px #ff2d5544}
.cyber-btn.ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.cyber-btn.ghost:hover{border-color:var(--red);color:#fff}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.alert{padding:12px 16px;border-radius:10px;margin-bottom:18px;font-size:.9rem;border:1px solid}
.alert-err{background:#2a0a12;border-color:#5a1a28;color:#ff8a9a}
.alert-ok{background:#0a2a18;border-color:#1a5a38;color:#7dffb3}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:16px}
.stat .v{font-family:'JetBrains Mono',monospace;font-size:1.4rem;font-weight:700}
.stat .l{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:4px}
@media(max-width:900px){
  .sidebar{width:100%;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--border)}
  .main{margin-left:0;padding:20px}
  .grid-2,.grid-3{grid-template-columns:1fr}
  body{flex-direction:column}
}
</style>
{% block head %}{% endblock %}
</head>
<body>
<aside class="sidebar">
  <div class="sidebar-header"><h2>MDZ <span>C2</span></h2></div>
    <nav class="nav-links">
    <a class="nav-item" href="/"><i class="material-icons">rocket_launch</i> Painel</a>
    <a class="nav-item" href="/list"><i class="material-icons">list_alt</i> Ativos</a>
    <a class="nav-item" href="/ranking"><i class="material-icons">emoji_events</i> Ranking</a>
    <a class="nav-item" href="/proof/feed"><i class="material-icons">photo_library</i> Proofs</a>
    <a class="nav-item" href="/profile"><i class="material-icons">person</i> Perfil</a>
  </nav>
</aside>
<main class="main">
  {% block content %}{% endblock %}
</main>
</body>
</html>
