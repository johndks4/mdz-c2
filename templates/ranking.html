{% extends "base.html" %}
{% block title %}Ranking · MDZ C2{% endblock %}
{% block content %}
<div class="card" style="max-width:720px">
  <h2 class="card-title"><span class="dot"></span> RANKING</h2>
  <div style="display:flex;flex-direction:column;gap:10px">
  {% for u in board %}
    <div style="display:flex;align-items:center;gap:14px;background:var(--panel2);border:1px solid var(--border);border-radius:12px;padding:12px 16px">
      <div style="font-family:'JetBrains Mono',monospace;font-weight:700;width:36px;color:var(--muted)">#{{ u.place }}</div>
      <div style="font-size:1.4rem">{{ u.rank.emoji }}</div>
      <div style="flex:1">
        <div style="font-weight:700">{{ u.display_name }}</div>
        <div style="font-size:.75rem;color:var(--muted)">{{ u.rank.title }} · @{{ u.username }}</div>
      </div>
      <div style="font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--red)">{{ u.attacks }}</div>
    </div>
  {% else %}
    <p style="color:var(--muted)">Sem dados ainda.</p>
  {% endfor %}
  </div>
</div>
{% endblock %}
